upstream sso_backend {
    server sso-service:8080;
    keepalive 16;
}

upstream doc_backend {
    server doc-processor:8081;
    keepalive 16;
}

upstream ai_audit_backend {
    server ai-audit-service:8082;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # 1. Khai báo DNS Resolver của Docker để Nginx resolve IP động ở runtime
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 2. Khai báo biến đường dẫn Upstream Backend
    set $sso_backend "http://sso-service:8080";
    set $doc_backend "http://doc-processor:8081";
    set $ai_audit_backend "http://ai-audit-service:8082";
    
    location = /docs {
        return 301 $scheme://$http_host/api/v1/auth/docs/;
    }

    location = /api/v1/auth/docs {
        return 301 $scheme://$http_host/api/v1/auth/docs/;
    }

    location ^~ /api/v1/auth/swagger/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Accept-Encoding "";
        proxy_redirect off;
        sub_filter_once off;
        sub_filter_types application/javascript;
        sub_filter 'url: "doc.json"' 'url: "/api/v1/auth/docs/doc.json"';
        proxy_pass http://sso_backend/swagger/;
    }

    location = /api/v1/auth/docs/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Accept-Encoding "";
        proxy_redirect off;
        sub_filter_once off;
        sub_filter_types application/javascript;
        sub_filter 'url: "doc.json"' 'url: "/api/v1/auth/docs/doc.json"';
        proxy_pass http://sso_backend/swagger/index.html;
    }

    location ^~ /api/v1/auth/docs/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Accept-Encoding "";
        proxy_redirect off;
        sub_filter_once off;
        sub_filter_types application/javascript;
        sub_filter 'url: "doc.json"' 'url: "/api/v1/auth/docs/doc.json"';
        proxy_pass http://sso_backend/swagger/;
    }

    location ^~ /api/v1/auth/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        proxy_pass http://sso_backend/api/auth/;
    }

    # Backward compatibility: /api/auth/ routes (no v1 prefix)
    location ^~ /api/auth/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        proxy_pass http://sso_backend/api/auth/;
    }

    location = /api/v1/docs/docs {
        return 301 /api/v1/docs/docs/;
    }

    location ^~ /api/v1/docs/swagger/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Accept-Encoding "";
        proxy_redirect off;
        sub_filter_once off;
        sub_filter_types application/javascript;
        sub_filter 'url: "doc.json"' 'url: "/api/v1/docs/docs/doc.json"';
        proxy_pass http://doc_backend/swagger/;
    }

    location = /api/v1/docs/docs/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Accept-Encoding "";
        proxy_redirect off;
        sub_filter_once off;
        sub_filter_types application/javascript;
        sub_filter 'url: "doc.json"' 'url: "/api/v1/docs/docs/doc.json"';
        proxy_pass http://doc_backend/swagger/index.html;
    }

    location ^~ /api/v1/docs/docs/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Accept-Encoding "";
        proxy_redirect off;
        sub_filter_once off;
        sub_filter_types application/javascript;
        sub_filter 'url: "doc.json"' 'url: "/api/v1/docs/docs/doc.json"';
        proxy_pass http://doc_backend/swagger/;
    }

    location = /api/v1/docs {
        client_max_body_size 50M;
        include /etc/nginx/snippets/cors.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        proxy_pass http://doc_backend/api/v1/docs;
    }

    location ^~ /api/v1/docs/ {
        client_max_body_size 50M;
        include /etc/nginx/snippets/cors.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        proxy_pass http://doc_backend/api/v1/docs/;
    }

    location = /api/v1/audit/docs {
        return 301 /api/v1/audit/docs/;
    }

    location ^~ /api/v1/audit/docs/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Accept-Encoding "";
        proxy_redirect off;
        sub_filter_once off;
        sub_filter '/openapi.json' '/api/v1/audit/openapi.json';
        sub_filter '/docs/oauth2-redirect' '/api/v1/audit/docs/oauth2-redirect';
        proxy_pass http://ai_audit_backend/docs;
    }

    location = /api/v1/audit/openapi.json {
        include /etc/nginx/snippets/cors.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        proxy_pass http://ai_audit_backend/openapi.json;
    }

    location = /api/v1/audit/redoc {
        include /etc/nginx/snippets/cors.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        proxy_pass http://ai_audit_backend/redoc;
    }

    location ^~ /api/v1/audit/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        proxy_pass http://ai_audit_backend/api/v1/audit/;
    }

    location / {
        return 404;
    }
}