
services:
  # --- DATABASE: POSTGRESQL ---
  postgres:
    image: postgres:16-alpine
    container_name: demoxv-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demoxv_admin}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - demoxv-network

  # --- CACHE: REDIS ---
  redis:
    image: redis:7-alpine
    container_name: demoxv-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - demoxv-network

  # --- OBJECT STORAGE: MINIO ---
  minio:
    image: minio/minio
    container_name: demoxv-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - demoxv-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  demoxv-network:
    external: true
    name: librechat_default  # Kết nối chung mạng với LibreChat nếu cần